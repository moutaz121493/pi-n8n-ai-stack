# Lightweight 4 GB Raspberry Pi 5 profile (SQLite, single container, 384 MB RAM cap)
# Usage: docker compose -f docker-compose.pi4g.yml up -d

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.85.4
    restart: unless-stopped
    ports:
      - "${N8N_BIND_HOST:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      DB_TYPE: sqlite
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-72}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - n8n_pi4g_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m

volumes:
  n8n_pi4g_data:
