name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate n8n workflow templates
        run: python3 scripts/validate_workflows.py

      - name: Validate Docker Compose stacks
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.pi4g.yml config -q
